name: Release plugin ZIP
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches plugin version
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*\([0-9.]*\).*/\1/p' plugins/museum-calendar/museum-calendar.php)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin version ${version}."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/museum-calendar-*.zip \
            --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
